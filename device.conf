# ============================================================
#  device.conf  ——  整个框架唯一需要你改的文件
#  改完保存，重新编译即可。所有脚本都从这里读值。
# ============================================================

# ---------- 1. 设备身份 ----------
DEVICE_NAME="istoreos-gw"          # 主机名（登录后 shell 提示符、LuCI 顶部显示）
BRAND_NAME="N100-Router"           # 品牌/系统显示名（写成你喜欢的名字）
BRAND_VERSION="1.1"                # 版本号，显示在 LuCI 页脚
BRAND_VENDOR="my.lan"              # 厂商标识，随意

# 个性签名：编译者标识 + 自动日期（编译时自动生成，不用手改日期）
BUILDER_NAME="ny"                  # 你的署名，会显示在登录横幅和 LuCI 页脚

# 默认主题（开机自动启用）
# 可选：kucat / argon / bootstrap（系统自带）
THEME="kucat"

# ---------- 2. 家庭带宽 ----------
# 用于自动选择网络优化策略：>=500Mbps 自动开启软件流卸载
HOME_BANDWIDTH="1000"              # 单位 Mbps
HW_OFFLOAD="0"                     # 1=同时开启硬件流卸载（需网卡支持，出问题改回 0）

# ---------- 2. 管理地址 ----------
LAN_IP="192.168.6.1"
LAN_NETMASK="255.255.255.0"
LAN_DHCP_START="192.168.6.100"
LAN_DHCP_END="192.168.6.200"
LAN_DHCP_LEASE="12h"

# ---------- 3. 登录密码 ----------
# 留空 = 不设密码（你要的就是空密码）。
# 安全提醒：空密码只适合纯内网自用；设了值就会启用该密码。
ROOT_PASSWORD=""

# ---------- 4. 网络角色 ----------
# router = 主路由：第一个网口做 WAN（DHCP/PPPoE），其余网口桥接成 LAN，开 DHCP
# bypass = 旁路由：只用一个网口接主路由，关 DHCP，开 Masquerade
MODE="router"

# WAN 接入方式，仅 MODE=router 时生效
WAN_PROTO="dhcp"                   # dhcp | pppoe | static
PPPOE_USER=""
PPPOE_PASS=""

# ---------- 5. 网口自动识别 ----------
# auto   = 开机自动探测有几个物理网口，按探测结果分配（推荐）
# manual = 按下面两行固定分配
PORT_POLICY="auto"
MANUAL_WAN_PORT="eth0"
MANUAL_LAN_PORTS="eth1 eth2 eth3"

# ---------- 6. 存储 ----------
# 镜像里分区大小（MB）：内核 128 / 系统 2048
# 系统分区=overlay 可用空间，装 Docker + 一堆插件够用；
# 想一次给满整个 SSD，把它改成 SSD 容量（如 60000）。
KERNEL_SIZE_MB="128"
ROOTFS_SIZE_MB="2048"

# 高级：首次启动自动把根分区扩到整块盘（会重启一次，属于可选功能）
# 0 = 关闭（用 ROOTFS_SIZE_MB 的容量，最稳）
# 1 = 开启（自动 parted 扩容，需要 parted 包，已在默认清单里）
EXTEND_ROOTFS="0"

# ---------- 7. 区域与语言 ----------
TIMEZONE="CST-8"
ZONENAME="Asia/Shanghai"
LANG_CODE="zh_cn"
NTP_SERVER="ntp.aliyun.com"
