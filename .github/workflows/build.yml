name: build-firmware

on:
  workflow_dispatch:
  push:
    paths:
      - 'device.conf'
      - 'configs/**'
      - 'files/**'
      - 'scripts/**'
      - 'brand/**'
      - 'packages/**'
      - 'feeds.conf'
      - 'build.sh'
      - '.github/workflows/build.yml'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: 拉取框架仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev \
            libssl-dev python3-distutils rsync unzip zlib1g-dev \
            file wget subversion time

      # 关键：GitHub 免费 runner 磁盘只有约 14GB，OpenWrt 全量构建必爆盘。
      # 删掉 runner 预装但用不到的大目录，可腾出 10GB+ 空间。
      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache \
            /usr/local/.ghcup /usr/local/share/powershell \
            /usr/local/lib/android /usr/local/lib/node_modules \
            "$AGENT_TOOLSDIRECTORY" /opt/ghc 2>/dev/null || true
          echo "== 释放后磁盘 =="
          df -h / | sed 's/^/  /'

      - name: 编译
        run: bash build.sh
        env:
          JOBS: 4

      - name: 收集产物
        if: success()
        run: |
          mkdir -p out
          cp -v .src/istoreos/bin/targets/x86/64/*.img.gz out/ 2>/dev/null || true
          cp -v .src/istoreos/bin/targets/x86/64/sha256sums out/ 2>/dev/null || true
          ls -lh out

      - name: 上传构建日志（成功失败都上传，便于排查）
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          if-no-files-found: warn
          retention-days: 30

      - name: 上传固件
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.run_number }}
          path: out/*
          if-no-files-found: error
          retention-days: 30
