name: Build OpenWrt Firmware

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '选择编译分支'
        required: true
        default: 'openwrt-25.12'
        type: choice
        options:
          - openwrt-25.12
          - istoreos-24.10
      ssh:
        description: '启用 SSH 调试（连接时长 30 分钟）'
        required: false
        default: false
        type: boolean
      upload_release:
        description: '编译完成后上传固件到 Release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

env:
  REPO_URL: https://github.com/istoreos/istoreos
  REPO_BRANCH: ${{ github.event.inputs.branch }}
  CONFIG_DIR: configs/${{ github.event.inputs.branch }}
  DIY_PART1: diy-part1.sh
  DIY_PART2: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    if: github.event.repository.owner.id == github.event.sender.id

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@main

      - name: 释放磁盘空间
        run: |
          # OpenWrt 全量编译需 40~60GB，而 runner 的 / 盘默认仅约 21GB 可用。
          # 删除预装的开发套件（dotnet/android/ghc/llvm 等），可腾出约 25GB。
          # 注意：此步骤必须在「初始化编译环境」之前执行，否则会误删编译依赖。
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/.ghcup /usr/local/share/boost \
            /usr/lib/jvm /usr/share/swift /usr/share/miniconda /usr/share/rust
          sudo -E apt-get -y purge azure-cli ghc* zulu* llvm* firefox \
            google-chrome* dotnet* powershell openjdk* mongodb* moby* || true
          sudo -E apt-get -y autoremove --purge
          sudo -E apt-get clean
          docker rmi $(docker images -q) 2>/dev/null || true
          echo "=== 清理后磁盘占用 ==="
          df -hT /

      - name: 初始化编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update -y
          sudo -E apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            libelf-dev python3-setuptools python3-pyelftools rsync swig unzip \
            zlib1g-dev file wget xz-utils patch pigz dosfstools mtools \
            qemu-utils p7zip-full xxd uglifyjs autoconf automake libtool

      - name: 克隆 iStoreOS 源码
        run: |
          # 即使清理后，/ 盘也仅剩约 45GB，仍可能不够全量编译；
          # /mnt 挂载在另一块大容量磁盘（约 65GB+ 可用），故将源码树放到 /mnt，
          # 通过软链接映射回工作区，后续所有步骤的路径无需任何改动
          sudo mkdir -p /mnt/workdir
          sudo chown -R $(id -un):$(id -gn) /mnt/workdir
          ln -s /mnt/workdir "$GITHUB_WORKSPACE/openwrt"
          git clone --depth 1 -b $REPO_BRANCH $REPO_URL "$GITHUB_WORKSPACE/openwrt"
          cd "$GITHUB_WORKSPACE/openwrt"
          echo "源码分支: $(git branch --show-current)"
          df -hT "$PWD"

      - name: 加载自定义 feeds
        run: |
          cd openwrt
          cp $GITHUB_WORKSPACE/$CONFIG_DIR/feeds.conf.default feeds.conf.default
          # 清洗1：删除孤立的 "#" 行
          # （官方 scripts/feeds 的注释剥离正则 s/#.+$/ 要求 # 后还有字符，
          #   单独的 # 行会漏剥并被判定为语法错误 "Syntax error in feeds.conf.default"）
          sed -i '/^[[:space:]]*#[[:space:]]*$/d' feeds.conf.default
          # 清洗2：统一为 LF 行尾（CRLF 会让剥离后残留的 \r 触发语法错误）
          sed -i 's/\r$//' feeds.conf.default
          # 清洗3：去除文件头 BOM
          sed -i '1s/^\xEF\xBB\xBF//' feeds.conf.default
          cat feeds.conf.default

      - name: 更新并安装 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 运行 diy-part1.sh（添加插件源码）
        env:
          BRANCH: ${{ github.event.inputs.branch }}
        run: |
          chmod +x $GITHUB_WORKSPACE/$DIY_PART1
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_PART1

      - name: 复制自定义文件（files/）
        run: |
          cd openwrt
          cp -rf $GITHUB_WORKSPACE/files/. .

      - name: 加载 .config 配置文件
        run: |
          cd openwrt
          cp $GITHUB_WORKSPACE/$CONFIG_DIR/.config .config
          make defconfig

      - name: 运行 diy-part2.sh（系统定制）
        run: |
          chmod +x $GITHUB_WORKSPACE/$DIY_PART2
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_PART2

      - name: SSH 调试（可选）
        if: ${{ github.event.inputs.ssh == 'true' }}
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 30

      - name: 下载源代码（dl）
        run: |
          cd openwrt
          make download -j$(nproc)
          find dl -size -1024c -exec ls -l {} \; 2>/dev/null | head -20
          find dl -size -1024c -exec rm -f {} \; 2>/dev/null

      - name: 编译固件
        run: |
          cd openwrt
          echo "=== 编译前磁盘占用 ==="
          df -hT / /mnt
          make -j$(nproc) V=sc || make -j1 V=s

      - name: 整理固件输出并生成编译信息
        run: |
          cd openwrt
          mkdir -p $GITHUB_WORKSPACE/artifact

          TARGET_DIR="bin/targets/x86/64"
          for pattern in \
            "*squashfs-combined-efi.img.gz" \
            "*squashfs-combined-efi.vmdk" \
            "*squashfs-combined.img.gz" \
            "*squashfs-combined.vmdk" \
            "*.manifest"; do
            find "$TARGET_DIR" -maxdepth 1 -type f -name "$pattern" \
              -exec cp {} $GITHUB_WORKSPACE/artifact/ \; 2>/dev/null || true
          done

          # 生成编译信息
          BUILD_INFO="$GITHUB_WORKSPACE/artifact/BUILD_INFO.md"
          echo "# OpenWrt 定制固件编译信息" > $BUILD_INFO
          echo "" >> $BUILD_INFO
          echo "## 基本信息" >> $BUILD_INFO
          echo "- **源码仓库**: $REPO_URL" >> $BUILD_INFO
          echo "- **编译分支**: $REPO_BRANCH" >> $BUILD_INFO
          echo "- **设备架构**: x86-64" >> $BUILD_INFO
          if grep -q 'CONFIG_LINUX_6_12=y' .config 2>/dev/null; then
            echo "- **内核版本**: 6.12" >> $BUILD_INFO
          elif grep -q 'CONFIG_LINUX_6_6=y' .config 2>/dev/null; then
            echo "- **内核版本**: 6.6" >> $BUILD_INFO
          else
            echo "- **内核版本**: 见 .config" >> $BUILD_INFO
          fi
          echo "- **管理地址**: 192.168.6.1（空密码）" >> $BUILD_INFO
          echo "- **编译时间**: $(TZ=UTC-8 date '+%Y-%m-%d %H:%M:%S')" >> $BUILD_INFO
          echo "" >> $BUILD_INFO
          echo "## 分区大小" >> $BUILD_INFO
          echo "- **内核分区**: $(grep 'CONFIG_TARGET_KERNEL_PARTSIZE=' .config 2>/dev/null | cut -d= -f2) MB" >> $BUILD_INFO
          echo "- **系统分区**: $(grep 'CONFIG_TARGET_ROOTFS_PARTSIZE=' .config 2>/dev/null | cut -d= -f2) MB" >> $BUILD_INFO
          echo "" >> $BUILD_INFO
          echo "## 已编译的 LuCI 插件" >> $BUILD_INFO
          grep 'CONFIG_PACKAGE_luci-app-' .config 2>/dev/null | grep '=y' | sed 's/CONFIG_PACKAGE_//;s/=y//' | sort | while read pkg; do echo "- $pkg" >> $BUILD_INFO; done
          echo "" >> $BUILD_INFO
          echo "## 已编译的主题" >> $BUILD_INFO
          grep 'CONFIG_PACKAGE_luci-theme-' .config 2>/dev/null | grep '=y' | sed 's/CONFIG_PACKAGE_//;s/=y//' | sort | while read pkg; do echo "- $pkg" >> $BUILD_INFO; done
          echo "" >> $BUILD_INFO
          echo "=== 固件文件列表 ==="
          ls -lh $GITHUB_WORKSPACE/artifact/ || echo "未找到固件文件"

      - name: 上传固件到 Artifact
        uses: actions/upload-artifact@main
        with:
          name: OpenWrt_${{ env.REPO_BRANCH }}
          path: artifact/
          if-no-files-found: warn

      - name: 上传到 Release
        if: ${{ github.event.inputs.upload_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: OpenWrt_${{ env.REPO_BRANCH }}_${{ github.run_id }}
          name: OpenWrt ${{ env.REPO_BRANCH }} 固件
          body: |
            管理地址：192.168.6.1（root 空密码）
            源码分支：${{ env.REPO_BRANCH }}
            分区：内核 64MB / 系统 2048MB
            详细编译信息请查看 Artifact 中的 BUILD_INFO.md
          files: artifact/*
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
