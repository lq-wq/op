name: build-firmware

on:
  workflow_dispatch:
  push:
    paths:
      - 'device.conf'
      - 'configs/**'
      - 'files/**'
      - 'scripts/**'
      - 'brand/**'
      - 'packages/**'
      - 'feeds.conf'
      - 'build.sh'
      - '.github/workflows/build.yml'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: 拉取框架仓库
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev \
            libssl-dev python3-distutils rsync unzip zlib1g-dev \
            file wget subversion time

      - name: 缓存源码与下载
        uses: actions/cache@v4
        with:
          path: |
            .src/istoreos/.git
            .src/istoreos/dl
            .src/istoreos/staging_dir
          key: istoreos-${{ hashFiles('device.conf', 'configs/packages.list', 'feeds.conf') }}
          restore-keys: |
            istoreos-

      - name: 编译
        run: bash build.sh
        env:
          JOBS: 4

      - name: 收集产物
        run: |
          mkdir -p out
          cp -v .src/istoreos/bin/targets/x86/64/*.img.gz out/ 2>/dev/null || true
          cp -v .src/istoreos/bin/targets/x86/64/sha256sums out/ 2>/dev/null || true
          ls -lh out

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.run_number }}
          path: out/*
          if-no-files-found: error
          retention-days: 30
