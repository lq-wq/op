# 在 iStoreOS 默认 feeds 之后追加的「额外源」
# 重要：build.sh 会把它拼接到 feeds.conf.default 之后生成源码树的 feeds.conf，
#       所以这里只写「额外的」，不要抄官方那五行。
#
# 编译报某个包缺失/编译失败时，把对应 feed 和 packages.list 里的包一起注释掉。

# iStore 应用商店（luci-app-store）
src-git istore https://github.com/linkease/istore.git

# kenzok8 精选包：adguardhome / luci-app-adguardhome 等（核心二进制随包编译，开箱即用）
src-git kenzok8 https://github.com/kenzok8/small-package.git

# OpenClash（luci-app-openclash；核心由 50-openclash-core 首启自动下载）
src-git openclash https://github.com/vernesong/OpenClash.git

# 应用过滤 OpenAppFilter（luci-app-oaf + kmod-oaf）
# 注意：oaf 内核模块对新内核（6.x）兼容性一般，编译失败就注释这两处
src-git oaf https://github.com/destan19/OpenAppFilter.git

# 主题
src-git kucat https://github.com/jerrykuku/luci-theme-kucat.git
src-git argon https://github.com/jerrykuku/luci-theme-argon.git

# 你自己的私有插件仓库
# src-git myapps https://github.com/你的用户名/my-openwrt-apps.git
